<!DOCTYPE html>
<html>
<head>
  <title>Socket.io Test</title>
</head>
<body>
  <input id="token" placeholder="Enter JWT token" style="width: 300px;" />
  <button onclick="connectSocket()">Connect</button>
  <input id="receiverId" placeholder="Enter receiver ID" type="number" />
  <input id="message" placeholder="Type a message" />
  <button onclick="sendMessage()">Send</button>
  <ul id="messages"></ul>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    function connectSocket() {
      const token = document.getElementById('token').value;
      socket = io('http://localhost:3003', { auth: { token } });
      socket.off('message'); // Clear existing listeners
      document.getElementById('messages').innerHTML = ''; // Clear message list
      socket.on('connect', () => {
        console.log('Connected to server');
      });
      socket.on('connect_error', (err) => {
        console.log('Connection error:', err.message);
      });
      socket.on('message', (data) => {
        const li = document.createElement('li');
        li.textContent = `${data.sender}: ${data.content} (${new Date(data.timestamp).toLocaleString()})`;
        document.getElementById('messages').appendChild(li);
      });
    }
    function sendMessage() {
      const message = document.getElementById('message').value;
      const receiverId = parseInt(document.getElementById('receiverId').value) || null;
      socket.emit('message', { content: message, receiverId });
      document.getElementById('message').value = '';
      document.getElementById('receiverId').value = '';
    }
  </script>
</body>
</html>
